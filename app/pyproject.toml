[project]
name = "guruclocker"
version = "1.0.0"
description = "Paste video links, get transcripts + condensed action steps sorted into folders."
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.80",
    "yt-dlp>=2026.1.1",
    "imageio-ffmpeg>=0.6",      # bundles an ffmpeg binary, so nobody has to install ffmpeg by hand
    "python-dotenv>=1.0",
    "rich>=13.7",
    # Speech-to-text. Apple Silicon Macs use MLX (fast, on the Mac's GPU); everything else uses faster-whisper.
    "mlx-audio==0.6.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    # CUDA runtime libraries for NVIDIA GPUs (64-bit Windows and Linux only; unused if there's no NVIDIA card).
    # cuBLAS is capped below 12.9.3 because 12.9.3 ships no Windows wheel.
    "nvidia-cublas-cu12>=12.4,<12.9.3; (sys_platform == 'win32' and platform_machine in 'AMD64 x86_64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "nvidia-cudnn-cu12>=9,<10; (sys_platform == 'win32' and platform_machine in 'AMD64 x86_64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guruclocker"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["."]
